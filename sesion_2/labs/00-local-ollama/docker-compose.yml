# Laboratorio LOC-01. Todos los puertos se publican SOLO en 127.0.0.1:
# Ollama no tiene autenticación y nunca debe quedar expuesto a la red.
services:
  ollama:
    image: ollama/ollama:latest   # fije una versión concreta tras validarla en su equipo
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      APP_OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-models:
