apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: asistente
data:
  APP_PROVIDER: ollama
  APP_OLLAMA_BASE_URL: http://ollama.asistente.svc.cluster.local:11434
  APP_MODEL: qwen2.5:1.5b
  APP_LOG_LEVEL: INFO
  APP_OTEL_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: asistente
  labels: {app: backend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:   # réplicas repartidas entre zonas (Unidad C, HA)
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: backend}
      containers:
        - name: backend
          image: REGISTRO/asistente-backend:1.0.0   # construya con labs/00-local-ollama/backend/Dockerfile
          envFrom:
            - configMapRef: {name: backend-config}
          ports:
            - {containerPort: 8000, name: http}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: asistente
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: asistente
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: backend}
---
# Escalado por CPU: aproximación didáctica. En inferencia real conviene escalar
# por longitud de cola o por TTFT (métricas personalizadas), ver Unidad F.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: asistente
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: backend}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
